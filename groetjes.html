<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Groetjes</title>

<!--
  BESLISSINGSLOG
  - Twee keuzelijsten: taal links, land rechts. Eén regel hoog, geen toetsenbord.
    Beide placeholders beginnen met een emoji (🗣️ en 🌍) zodat de knop zelf al scanbaar is;
    dat is de enige manier om een icoon in een native select te krijgen zonder hem na te bouwen.
  - Landopties krijgen de vlag ervoor, dus je kunt visueel zoeken zonder de naam te lezen.
  - België en Zuid-Afrika staan twee keer, want ze hebben twee talen in deze lijst. In plaats
    van twee identieke regels staat de taalnaam erachter: Zuid-Afrika — Zoeloe.
  - Banner is een bollenveld in perspectief met de molen op het verdwijnpunt, in SVG
    getekend vanuit een klein aantal knoppen (zie tekenBanner). Altijd marine, ook in
    light mode; dark mode voegt alleen een roomkleurige ring van 3px toe, anders loopt
    het marine weg in de donkere paginakleur. Palet van het evenement: marine, framboos,
    oker, paars, room. Deze vijf en niet meer.
  - Alleen het wordmerk in de banner, geen ondertitel. Het wordmerk volgt de
    interfacetaal: Groetjes! / Greetings!. De tekstlaag is beperkt tot 62,5% hoogte
    zodat de tekst volledig in de lucht staat; niet weghalen.
  - De alfabetische volgorde zit binnen de keuzelijst, niet in de pagina. Dat is belangrijk:
    alfabetisch verschilt per interfacetaal (Zuid-Korea bij de Z, South Korea bij de S), en
    zo klapt de kaartenlijst niet om als je van taal wisselt. De lijst houdt zijn kleurritme.
  - Elke optie toont het endoniem erachter: Polen (Polska), Zuid-Korea (한국). Gratis, en
    bruikbaar als iemand jou zijn eigen land aanwijst.
  - Groepen weg. Met achttien talen en twee keuzelijsten voegde de indeling niets meer toe,
    en 'minder vaak gehoord' klopte niet meer met Nederlands en Scandinavisch erin.
  - Taalkiezer staat in de flow boven het wordmerk, niet er absoluut overheen: Pacifico is
    hoog en gedraaid en liep er anders achter.
  - Afrikaans staat direct onder Zoeloe, zodat het Zuid-Afrikaanse paar bij elkaar blijft.
  - Portugees staat middenin en niet achteraan: minder algemeen bekend dan Spaans of Frans.
  - Achttien talen in één lijst, geen restcategorie meer. Scandinavisch is drie losse kaarten, want juist
    naast elkaar zie je waar Noors, Zweeds en Deens uiteenlopen. Engels en Nederlands krijgen
    dezelfde behandeling als de rest.
  - Vier Noordse kruizen in vier kleuren: Fins blauw, Zweeds goud, Noors marine, Deens rood.
    Gedeelde vorm want gedeelde vlagtraditie; de kleur doet het onderscheid.
  - Frans krijgt het groen van Ivoorkust; oranje is nu van Nederlands.
  - Fonetiek in de brontaal zelf blijft leeg: Engelse uitspraak van Engels heeft geen zin.
  - België staat twee keer in de landlijst, bij Nederlands en bij Frans. Dat is geen fout:
    het land heeft beide talen en je kiest zelf welke kaart je wilt.
    Daarmee is de lijstvolgorde geen zoekhulpmiddel meer en mag hij op ritme gekozen worden.
  - Achttien vlaggen putten grotendeels uit rood, wit en blauw, dus botsing is onvermijdelijk.
    Twee maatregelen: binnen elke hoefamilie een bewuste lichtheidstrap (diep karmijn,
    helder scharlaken, terracotta, bordeaux), en een volgorde waarin geen twee buren
    dezelfde familie delen. Zweeds is van goud naar Zweeds blauw gegaan omdat er drie
    bijna identieke gouden kaarten stonden; Afrikaans van rood naar het goud uit dezelfde vlag.
  - Eén kleur per taal uit de vlag, maar gekozen op onderling verschil:
    Frans krijgt het oranje van Ivoorkust, Spaans terracotta uit het rood dat Spanje en Peru
    delen, Albanees het zwart (enige donkere blok, dus een anker), Zoeloe groen en Afrikaans
    rood, allebei uit de huidige Zuid-Afrikaanse vlag.
  - Ribbon van 14 naar 32px zodat de kleur echt aankomt; kaartvlak juist maar licht getint.
  - Zuid-Afrika heeft twee talen. De pil springt naar Zoeloe; Afrikaans staat er direct onder,
    met een groepskop ertussen. Dat is een compromis: adjacency wint het niet van de indeling.
  - Landpillen rechts naast de taalnaam, met terugval naar de regel eronder. Niet afkorten.
  - Tweetalig NL/EN. De fonetiek is per brontaal apart geschreven; die is niet uitwisselbaar,
    want dzjenj DOB-ry is Nederlandse spelling en jane DOH-bry Engelse.
  - Elke taal heeft fonetiek, ook de wereldtalen. De eerdere uitzondering nam aan dat de
    lezer Nederlands is; dat gaat niet op zodra de app tweetalig is.
  - Contrast: tekst is niet met de accentkleur gemengd. Taalnaam wel, maar met zwart erbij.
  - Spraak via het apparaat zelf; Google Translate blokkeert inbedding met frame-ancestors,
    dus een iframe kan niet. Waar geen stem is, valt hij terug op een link.
  - Mobiel eerst. Geen opslag, geen build, één bestand.
  - Vijfde zin per kaart: fijne dag (☀️), na tot ziens. Zelfde principe als de rest:
    gastvrijheid, lokt geen gesprek uit.
  - Sranantongo heeft een eigen kaart (besloten 2026-08). Suriname staat daardoor twee
    keer in de landkiezer, net als België; de kiezer lost dat zelf op met de taalnaam
    erachter. Kleur: het groen uit de Surinaamse vlag, motief: de vlagbanden.
  - Albanese klemtonen gecorrigeerd na naslag: faleminderit en mirupafshim hebben de
    klemtoon op de voorlaatste lettergreep, niet op de laatste.
  - Kroatisch & Servisch lopen bij fijne dag uiteen: ugodan dan tegenover prijatan dan.
    De kaart toont Kroatisch in Latijns schrift en Servisch in cyrillisch; de notitie
    legt het uit. De eerste vier zinnen blijven woordelijk identiek.
  - Zesde en zevende zin: we houden van je (🫶) en ik hou van je (💛), als groeps- en
    persoonlijke bedankvorm. Veiligheidsregel per taal: nooit de letterlijke
    liefdesverklaring, maar het vriendschaps-idioom (glad i deg, holder af dig, tycker
    om, querer, adorer, adorar, uwielbiam, tin la tine, xhan, rakas). De wij-vorm is in
    geen enkele taal romantisch; de ik-vorm gebruikt daarom expliciet de vriendenvorm.
    Alles per taal nagezocht met bron (2026-08).
  - Luistersessie per kaart (Luister-knop in de voet): label in de interfacetaal, dan
    de doelzin twee keer, alle vijf de regels, in een loop tot stop. Voor passief leren
    tijdens het schoonmaken. Bewust via speechSynthesis en niet met audiobestanden;
    iOS pauzeert spraak bij schermvergrendeling, dus het scherm moet aan blijven.
    Bewust alleen per kaart, geen alles-achter-elkaar-sessie.
-->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Noto+Sans+KR:wght@500&family=Pacifico&display=swap" rel="stylesheet">

<style>
:root {
  --font: "Manrope", system-ui, -apple-system, sans-serif;
  --font-schrift: "Noto Sans KR", "Manrope", sans-serif;
  --font-script: "Pacifico", cursive;

  --papier: #faf8f2;
  --grond:  #eae7e0;
  --inkt:   #131416;
  --zacht:  #55574f;
  --lijn:   #cdcbc3;

  --r1: .25rem; --r2: .5rem; --r3: .875rem; --r4: 1.25rem; --r5: 1.75rem;
  --radius: 10px;
  --radius-groot: 15px;
}
@media (prefers-color-scheme: dark) {
  :root { --papier:#1c1d20; --grond:#101113; --inkt:#f4f3ee; --zacht:#a8aaa3; --lijn:#3b3d40; }
}

* { box-sizing: border-box; }

html { scroll-behavior: smooth; }

body {
  margin: 0; padding: var(--r3) var(--r3) 4rem;
  min-height: 100vh;
  background: var(--grond); color: var(--inkt);
  font-family: var(--font); font-size: 16px; font-weight: 600; line-height: 1.45;
  -webkit-font-smoothing: antialiased;
}
.omhulsel { max-width: 27rem; margin: 0 auto; }

/* ---------- kop ---------- */

.ansicht {
  --ill-lucht: #20224e;
  --ill-merk:  #f7f2e4;

  position: relative;
  border-radius: var(--radius-groot);
  overflow: hidden;
  margin-bottom: var(--r4);
  background: var(--ill-lucht);
}
@media (prefers-color-scheme: dark) {
  .ansicht { box-shadow: 0 0 0 3px var(--ill-merk); }
}

.tafereel { display: block; width: 100%; height: auto; aspect-ratio: 400 / 240; }

/* Wordmerk tussen home-chip en horizon: begint pas op 16% hoogte zodat de
   G-krul vrij blijft van de chip linksboven, en stopt boven de horizon.
   Niet weghalen: anders overlapt de tekst chip of veld. */
.ansicht-tekst {
  position: absolute; left: 0; right: 0; top: 16%; bottom: 37.5%;
  display: flex; align-items: center;
  padding: 0 1.4rem .8rem;
  pointer-events: none;
}

.taalschakelaar {
  position: absolute; top: .6rem; right: .65rem;
  display: flex; gap: 2px;
  background: color-mix(in srgb, var(--ill-merk) 16%, transparent);
  border-radius: 999px; padding: 2px;
  z-index: 2;
}
.taalschakelaar button {
  font: inherit; font-size: .6875rem; font-weight: 800;
  border: 0; border-radius: 999px; padding: 3px 9px;
  background: none; color: color-mix(in srgb, var(--ill-merk) 70%, transparent); cursor: pointer;
}
.taalschakelaar button[aria-pressed="true"] { background: var(--ill-lucht); color: var(--ill-merk); }

/* home-chip: gedeeld terug-naar-home-patroon (zie CLAUDE.md),
   linksboven in de banner, gespiegeld aan de taalschakelaar */
.home-chip {
  position: absolute; top: .45rem; left: .6rem; z-index: 2;
  width: 34px; height: 34px;
  display: flex; align-items: center; justify-content: center;
  background: color-mix(in srgb, var(--ill-merk) 16%, transparent);
  border-radius: 999px;
  color: var(--ill-merk);
}
.home-chip svg { width: 16px; height: 16px; }

.wordmerk {
  font-family: var(--font-script); font-weight: 400;
  font-size: clamp(2.5rem, 13.5vw, 3.3rem); line-height: 1.05;
  color: var(--ill-merk); margin: 0; transform: rotate(-4deg);
}

/* ---------- keuzelijsten ---------- */

.kiezers { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: var(--r5); }
.kiezer {
  font: inherit; font-size: .875rem; font-weight: 700;
  color: var(--inkt);
  background: var(--papier);
  border: 2px solid var(--lijn);
  border-radius: var(--radius);
  padding: 11px 10px;
  width: 100%;
  cursor: pointer;
  appearance: none;
  background-image: linear-gradient(45deg, transparent 50%, currentColor 50%), linear-gradient(135deg, currentColor 50%, transparent 50%);
  background-position: calc(100% - 15px) calc(50% + 1px), calc(100% - 10px) calc(50% + 1px);
  background-size: 5px 5px, 5px 5px;
  background-repeat: no-repeat;
  padding-right: 26px;
}

/* ---------- groepen ---------- */

.regio { margin-bottom: 2.25rem; }
.regiokop {
  font-size: .75rem; font-weight: 800;
  text-transform: uppercase; letter-spacing: .13em;
  color: var(--zacht);
  margin: 0 0 var(--r3); padding-left: 2px;
}

.rijen { list-style: none; margin: 0; padding: 0; display: grid; gap: var(--r4); }

.rij {
  --vlak: color-mix(in srgb, var(--kleur) 8%, var(--papier));
  --tekstkleur: color-mix(in srgb, var(--kleur) 76%, #000);
  --randkleur: color-mix(in srgb, var(--kleur) 40%, var(--lijn));
  background: var(--vlak);
  border: 2px solid var(--randkleur);
  border-radius: var(--radius-groot);
  overflow: hidden;
  scroll-margin-top: var(--r3);
}
@media (prefers-color-scheme: dark) {
  .rij { --tekstkleur: color-mix(in srgb, var(--kleur) 58%, #fff); }
}

.rijknop {
  display: block; width: 100%; padding: 0; border: 0; background: none;
  font: inherit; color: inherit; text-align: left; cursor: pointer;
}
/* display:block is essentieel: een span negeert height en de band verdwijnt */
.band { display: block; height: 32px; background-image: var(--motief); background-size: var(--maat); }

.rijtekst {
  display: grid; grid-template-columns: 1fr 1.25rem;
  align-items: start; gap: var(--r3);
  padding: var(--r3);
}
.naamblok { display: flex; flex-wrap: wrap; align-items: baseline; gap: var(--r2) var(--r3); min-width: 0; }
.taalnaam { font-size: 1.3125rem; font-weight: 800; letter-spacing: -.03em; line-height: 1.1; color: var(--tekstkleur); }
.landen { display: flex; flex-wrap: wrap; gap: 5px; }
.land {
  display: inline-flex; align-items: center; gap: 5px;
  font-size: .8125rem; font-weight: 700;
  background: color-mix(in srgb, var(--kleur) 15%, transparent);
  border-radius: 999px; padding: 3px 11px 3px 8px; white-space: nowrap;
}
.pijl { color: var(--zacht); display: block; margin-top: 5px; }
.pijl svg { width: 1.1rem; height: 1.1rem; transition: transform .18s; }
.rijknop[aria-expanded="true"] .pijl svg { transform: rotate(180deg); }

/* ---------- uitgeklapt ---------- */

.uit { border-top: 2px solid var(--randkleur); padding: var(--r1) var(--r3) var(--r3); }

.zin {
  display: grid; grid-template-columns: 7rem 1fr;
  gap: var(--r4);
  align-items: baseline;
  padding: var(--r3) 0;
}
.zin + .zin { border-top: 1px solid color-mix(in srgb, var(--kleur) 22%, transparent); }

.zinnl { font-size: 1rem; font-weight: 700; color: var(--zacht); }
.zinnl .em { font-size: 1.1875rem; margin-right: .2rem; }

.zinrechts { min-width: 0; display: flex; align-items: flex-start; gap: var(--r2); }
.zinwoorden { flex: 1; min-width: 0; }
.zindoel { font-size: 1.25rem; font-weight: 800; letter-spacing: -.025em; line-height: 1.15; overflow-wrap: anywhere; }
.zinschrift { font-family: var(--font-schrift); font-size: 1rem; font-weight: 500; color: var(--zacht); margin-top: 1px; }
.zinfon { font-size: .9375rem; font-weight: 700; color: var(--zacht); margin-top: 2px; }
.zinfon u { text-decoration-thickness: 2px; text-underline-offset: 3px; }

.spreek {
  flex: none; width: 2.25rem; height: 2.25rem;
  display: grid; place-items: center;
  background: color-mix(in srgb, var(--kleur) 88%, #000);
  border: 0; border-radius: 999px; color: #fff; cursor: pointer; padding: 0;
}
.spreek svg { width: 1.0625rem; height: 1.0625rem; }

.voet { display: flex; flex-wrap: wrap; gap: var(--r3); align-items: center; margin-top: var(--r3); }
.speelKnop {
  display: inline-flex; align-items: center; gap: 6px;
  font: inherit; font-size: .8125rem; font-weight: 700;
  background: color-mix(in srgb, var(--kleur) 88%, #000);
  color: #fff; border: 0; border-radius: var(--radius);
  padding: 5px 12px; cursor: pointer;
}
.speelKnop svg { width: .9rem; height: .9rem; }
.speelKnop .ik-stop { display: none; }
.speelKnop[aria-pressed="true"] .ik-speel { display: none; }
.speelKnop[aria-pressed="true"] .ik-stop { display: block; }

/* actieve regel tijdens de luistersessie; negatieve marge + gelijke padding,
   dus de inhoud verschuift niet */
.zin.actief {
  background: color-mix(in srgb, var(--kleur) 14%, transparent);
  border-radius: var(--radius);
  margin: 0 calc(-1 * var(--r2));
  padding-left: var(--r2); padding-right: var(--r2);
}
.zin.actief + .zin { border-top-color: transparent; }
.meerKnop {
  font: inherit; font-size: .8125rem; font-weight: 700;
  background: none; border: 1px solid var(--randkleur); border-radius: var(--radius);
  color: var(--inkt); padding: 5px 11px; cursor: pointer;
}
.gtLink { font-size: .8125rem; font-weight: 700; color: var(--zacht); }
.notitie {
  margin-top: var(--r3); padding: var(--r3);
  background: color-mix(in srgb, var(--kleur) 12%, transparent);
  border-radius: var(--radius);
  font-size: .875rem; font-weight: 600;
}

/* ---------- ook aanwezig ---------- */

.stil {
  background: var(--papier); border: 2px solid var(--lijn);
  border-radius: var(--radius-groot); padding: var(--r3) var(--r4);
  scroll-margin-top: var(--r3);
}
.stiltitel { font-size: 1rem; font-weight: 800; margin: 0 0 var(--r2); letter-spacing: -.02em; }
.stil .land { background: var(--grond); }
.stilzinnen { font-size: .9375rem; font-weight: 700; color: var(--zacht); margin: var(--r2) 0 0; }

:focus-visible { outline: 3px solid var(--inkt); outline-offset: 2px; }
[hidden] { display: none !important; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } * { transition: none !important; } }
</style>
</head>
<body>
<div class="omhulsel">
  <div class="ansicht">
    <!-- Bollenveld in perspectief, molen op het verdwijnpunt.
         De inhoud wordt eenmalig getekend door tekenBanner(). -->
    <svg class="tafereel" id="tafereel" viewBox="0 0 400 240" preserveAspectRatio="xMidYMid slice"
         role="img" aria-label="Bollenveld met molen"></svg>

    <!-- home-chip: gedeeld terug-naar-home-patroon (zie CLAUDE.md) -->
    <a class="home-chip" href="./" aria-label="Home" title="Home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M9.5 21v-6h5v6"/></svg></a>

    <div class="ansicht-tekst">
      <p class="wordmerk" id="wordmerk">Groetjes!</p>
    </div>

    <div class="taalschakelaar" id="taalschakelaar">
      <button data-taal="nl" aria-pressed="true">NL</button>
      <button data-taal="en" aria-pressed="false">EN</button>
    </div>
  </div>

  <div id="inhoud"></div>
</div>
<script>
/* ---- talen ----
   Volgorde is met de hand gezet zodat buren niet dezelfde hoefamilie hebben.
   kleur komt uit de vlag, maar bewust gekozen op onderling verschil:
   - Frans krijgt het oranje van Ivoorkust in plaats van Frans blauw
   - Spaans krijgt terracotta uit het rood dat Spanje en Peru delen
   - Albanees krijgt het zwart uit de vlag; het enige donkere blok in de lijst en dus een anker
   - Zoeloe en Afrikaans krijgen groen en rood, allebei uit de huidige Zuid-Afrikaanse vlag  */

const CREME = "#f6f2e6";

const KRUIS = (kruis, grond) =>
  "linear-gradient(90deg, transparent 30%, " + kruis + " 30% 45%, transparent 45%)," +
  "linear-gradient(0deg, transparent 40%, " + kruis + " 40% 58%, transparent 58%)," +
  "linear-gradient(" + grond + "," + grond + ")";


const TALEN = [
  { id: "fins", regio: 1, kleur: "#2f80c9",
    naam: { nl: "Fins", en: "Finnish", endo: "suomi" },
    landen: [{ vlag: "🇫🇮", nl: "Finland", en: "Finland", endo: "Suomi" }],
    motief: KRUIS("#2f80c9", CREME), maat: "30px 22px",
    notitie: {
      nl: "Klemtoon altijd op de eerste lettergreep, zonder uitzondering. Kiitos is kort en Finnen horen het bijna nooit van buitenlanders, dus het valt op. Olet (meille) rakas is letterlijk je bent (ons) dierbaar; rakastan sinua bewaren Finnen voor geliefden.",
      en: "Stress always falls on the first syllable, no exceptions. Kiitos is short and Finns rarely hear it from foreigners, so it lands. Olet (meille) rakas literally means you are dear (to us); Finns keep rakastan sinua for lovers." },
    zinnen: [
      { em: "🙋", doel: "Hei", fon: { nl: "hei", en: "hay" } },
      { em: "😊", doel: "Kiitos", fon: { nl: "<u>kie</u>-tos", en: "<u>KEE</u>-toss" } },
      { em: "🎁", doel: "Ole hyvä", fon: { nl: "<u>o</u>-le <u>hy</u>-vae", en: "<u>O</u>-leh <u>HY</u>-va" } },
      { em: "👋", doel: "Näkemiin", fon: { nl: "<u>nae</u>-ke-mien", en: "<u>NA</u>-keh-meen" } },
      { em: "☀️", doel: "Hyvää päivänjatkoa", fon: { nl: "<u>hy</u>-vae <u>pai</u>-vaen-jat-koa", en: "<u>HY</u>-va <u>PIE</u>-van-yat-koh-ah" } },
      { em: "🫶", doel: "Olet meille rakas", fon: { nl: "<u>o</u>-let <u>mei</u>-le <u>ra</u>-kas", en: "<u>O</u>-let <u>MAY</u>-leh <u>RA</u>-kas" } },
      { em: "💛", doel: "Olet minulle rakas", fon: { nl: "<u>o</u>-let <u>mi</u>-noel-le <u>ra</u>-kas", en: "<u>O</u>-let <u>MEE</u>-nool-leh <u>RA</u>-kas" } }
    ]},

  { id: "deens", regio: 1, kleur: "#e4322a",
    naam: { nl: "Deens", en: "Danish", endo: "dansk" },
    landen: [{ vlag: "🇩🇰", nl: "Denemarken", en: "Denmark", endo: "Danmark" }],
    motief: KRUIS(CREME, "#e4322a"), maat: "30px 22px",
    notitie: {
      nl: "Zelfde woord als het Zweedse hej, andere klank: Denen zeggen hai. Farvel is ons vaarwel, maar in het Deens gewoon alledaags. Holder af dig is letterlijk we geven om je; elsker is in het Deens zwaar romantisch.",
      en: "Same word as Swedish hej, different sound: Danes say hy. Farvel is the same word as farewell, but everyday in Danish. Holder af dig literally means we care for you; elsker is heavily romantic in Danish." },

/* ---------------- banner ----------------
   Bollenveld in perspectief, molen op de zichtbare horizon. Alle baangrenzen
   lopen naar één verdwijnpunt, maar dat ligt (afkap) px achter de lucht: de
   banen eindigen stomp op de horizonlijn in plaats van in een vlijmscherpe
   punt, en de molen staat direct op die lijn.
   De grenzen liggen op gelijke boogafstand rond het verdwijnpunt, zodat elke
   baan op het scherm even dik oogt waar hij ook uitkomt (links, onder of
   rechts). Een sinusprofiel (midden) maakt de middelste banen tot 2x breder;
   dat maakt het geheel rustiger en minder bont. Eerdere verdelingen (gelijke
   stukken buitenrand, gelijke breedte op de onderrand, gelijke hoek) gaven
   links of onder rommelige of juist te grote vlakken.
   De eerste baan heeft geen roompad erachter: dat lag als losse lichte lijn
   direct onder de horizon. Het roompad van de laatste baan is framboos: room
   lag daar als losse driehoek tegen de rechterrand (afgekeurd). Met 7 banen
   zijn de eerste en laatste allebei framboos, dus rechts smelt de laatste baan
   samen met die strook tot één vlak; bewust zo gekozen. */

const BANNER = {
  lucht: "#20224e", merk: "#f7f2e4", veld: "#b93a54", pad: "#f7f2e4",
  banen: ["#b93a54", "#e39b3a", "#7b27a8"],
  breedte: 400, horizon: 150, onder: 240,   /* viewBox-maten; horizon = VP-hoogte */
  vp: 348,                                  /* verdwijnpunt, achter de lucht */
  aantal: 7, padDeel: 0.22,
  midden: 2,        /* breedtefactor van de middelste banen */
  afkap: 8,         /* px onder het VP waar de zichtbare horizon ligt */
  molenSchaal: 1.4  /* molen vergroot op verzoek, voet blijft op de horizon */
};

function tekenBanner() {
  const B = BANNER;
  const randL = B.onder - B.horizon;
  const randTotaal = randL + B.breedte + randL;
  const zichtHorizon = B.horizon + B.afkap;

  const randpunt = s =>
    s <= randL ? { x: 0, y: B.horizon + s } :
    s <= randL + B.breedte ? { x: s - randL, y: B.onder } :
    { x: B.breedte, y: B.onder - (s - randL - B.breedte) };

  const hoekpunten = [
    { s: randL, x: 0, y: B.onder },
    { s: randL + B.breedte, x: B.breedte, y: B.onder }
  ];

  /* knipt een baan af op de zichtbare horizon; het deel eronder blijft */
  const klem = punten => {
    const uit = [];
    for (let i = 0; i < punten.length; i++) {
      const a = punten[i], b = punten[(i + 1) % punten.length];
      const aIn = a.y >= zichtHorizon, bIn = b.y >= zichtHorizon;
      if (aIn) uit.push(a);
      if (aIn !== bIn) {
        const t = (zichtHorizon - a.y) / (b.y - a.y);
        uit.push({ x: a.x + t * (b.x - a.x), y: zichtHorizon });
      }
    }
    return uit;
  };

  const baan = (s1, s2) => {
    let punten = [{ x: B.vp, y: B.horizon }, randpunt(s1)];
    hoekpunten.forEach(c => { if (c.s > s1 && c.s < s2) punten.push(c); });
    punten.push(randpunt(s2));
    punten = klem(punten);
    if (punten.length < 3) return "";
    return "M" + punten.map(p => p.x.toFixed(2) + " " + p.y.toFixed(2)).join(" L") + " Z";
  };

  /* hoeken vanuit het VP: pi wijst naar horizon-links, 0 naar horizon-rechts */
  const afstandTotRand = phi => {
    const dx = Math.cos(phi), dy = Math.sin(phi);
    let t = randL / dy;
    if (dx > 0) t = Math.min(t, (B.breedte - B.vp) / dx);
    if (dx < 0) t = Math.min(t, -B.vp / dx);
    return t;
  };

  const sVanPhi = phi => {
    const t = afstandTotRand(phi);
    const x = B.vp + t * Math.cos(phi), y = B.horizon + t * Math.sin(phi);
    if (Math.abs(x) < 1e-6) return y - B.horizon;
    if (Math.abs(x - B.breedte) < 1e-6) return randL + B.breedte + (B.onder - y);
    return randL + x;
  };

  /* boogafstand langs de veldrand, cumulatief per hoekstapje */
  const N = 4000, cum = [0], phiVan = k => Math.PI * (1 - k / N);
  for (let k = 1; k <= N; k++)
    cum.push(cum[k - 1] + afstandTotRand(phiVan(k - 0.5)) * Math.PI / N);
  const totaal = cum[N];

  const sVanBoog = a => {
    let lo = 0, hi = N;
    while (hi - lo > 1) { const m = (lo + hi) >> 1; (cum[m] < a ? lo = m : hi = m); }
    return sVanPhi(phiVan(lo + (a - cum[lo]) / (cum[hi] - cum[lo])));
  };

  const gewichten = [];
  let somG = 0;
  for (let i = 0; i < B.aantal; i++) {
    const g = 1 + (B.midden - 1) * Math.sin(Math.PI * (i + 0.5) / B.aantal) ** 2;
    gewichten.push(g); somG += g;
  }

  const padArc = totaal * B.padDeel / B.aantal;
  let boog = 0, veld = "";
  for (let i = 0; i < B.aantal; i++) {
    const laatste = i === B.aantal - 1;
    const sA = i === 0 ? 0 : sVanBoog(boog);
    boog += gewichten[i] / somG * totaal;
    const sB = laatste ? randTotaal : sVanBoog(boog);
    const sSplit = i === 0 ? sB : sVanBoog(boog - padArc);
    veld += '<path d="' + baan(sA, sSplit) + '" fill="' + B.banen[i % B.banen.length] + '"/>';
    if (i > 0) veld += '<path d="' + baan(sSplit, sB) + '" fill="' + (laatste ? B.banen[0] : B.pad) + '"/>';
  }

  const molen =
    '<g transform="translate(' + B.vp + ',' + zichtHorizon + ') scale(' + B.molenSchaal + ')" fill="' + B.merk + '">' +
      '<path d="M-9 0 L-4.5-31 L4.5-31 L9 0 Z"/>' +
      '<g transform="translate(0,-33) rotate(20)">' +
        '<rect x="-2.5" y="-22" width="5" height="44" rx="1.5"/>' +
        '<rect x="-22" y="-2.5" width="44" height="5" rx="1.5"/>' +
      '</g>' +
    '</g>';

  el("tafereel").innerHTML =
    '<rect width="' + B.breedte + '" height="' + B.onder + '" fill="' + B.lucht + '"/>' +
    molen +
    '<path d="M0 ' + zichtHorizon + 'h' + B.breedte + 'v' + (B.onder - zichtHorizon) + 'H0Z" fill="' + B.veld + '"/>' +
    veld;
}

  /* landen: vlag ervoor zodat je visueel kunt zoeken, endoniem erachter.
     Een land dat bij twee talen hoort (België, Zuid-Afrika) komt twee keer voor;
     dan wordt de taalnaam erbij gezet, anders staan er twee identieke regels. */
  const landen = [];
  TALEN.forEach(t => t.landen.forEach(l =>
    landen.push({ vlag: l.vlag, naam: l[T], endo: l.endo, taal: t.naam[T], doel: t.id })));

  const aantal = {};
  landen.forEach(l => { aantal[l.naam] = (aantal[l.naam] || 0) + 1; });

  landen.sort((x, y) => x.naam.localeCompare(y.naam, T) || x.taal.localeCompare(y.taal, T));

  const landOpties = landen.map(l => {
    let tekst = l.vlag + "  " + l.naam;
    if (aantal[l.naam] > 1) tekst += " — " + l.taal;
    else if (l.endo) tekst += " (" + l.endo + ")";
    return kies(l.doel, tekst);
  }).join("");

  const talen = TALEN.map(t => ({
    tekst: t.naam[T] + (t.naam.endo ? " (" + t.naam.endo + ")" : ""),
    sorteer: t.naam[T], doel: t.id }));
  talen.sort((x, y) => x.sorteer.localeCompare(y.sorteer, T));

  return '<section class="kiezers">' +
    '<select class="kiezer" id="kiezerTaal" aria-label="' + L().kiesTaal + '">' +
      kies("", "🗣️  " + L().kiesTaal) + talen.map(t => kies(t.doel, t.tekst)).join("") +
    '</select>' +
    '<select class="kiezer" id="kiezerLand" aria-label="' + L().kiesLand + '">' +
      kies("", "🌍  " + L().kiesLand) + landOpties +
    '</select>' +
  '</section>';
}

/* Google Translate-broncodes, expliciet in plaats van sl=auto: automatisch
   herkennen ging mis (de Koreaanse romanisatie werd als Indonesisch gezien).
   De codes wijken soms af van de spraakcodes: nb wordt no, fil wordt tl.
   Sranantongo ontbreekt bewust: Google Translate kent die taal niet, dus die
   kaart krijgt geen Translate-link. */
const GT_CODE = {
  fins: "fi", deens: "da", zweeds: "sv", noors: "no", nederlands: "nl",
  portugees: "pt", spaans: "es", frans: "fr", pools: "pl", roemeens: "ro",
  kroatisch: "hr", albanees: "sq", kinyarwanda: "rw", zoeloe: "zu",
  afrikaans: "af", koreaans: "ko", filipino: "tl", engels: "en"
};

function gtLink(t) {
  const code = GT_CODE[t.id];
  if (!code) return "";
  /* Koreaans stuurt het hangul mee: de doel-regel is daar romanisatie.
     Kroatisch juist niet: het schrift op die kaart is de Servische variant. */
  const tekst = t.zinnen.map(z => t.id === "koreaans" && z.schrift ? z.schrift : z.doel).join("\n.........\n");
  /* nl naar nl vertalen is zinloos: dan wordt de andere interfacetaal het doel */
  const doelTaal = code === T ? (T === "nl" ? "en" : "nl") : T;
  return "https://translate.google.com/?sl=" + code + "&tl=" + doelTaal + "&text=" + encodeURIComponent(tekst) + "&op=translate";
}

function taalHtml(t) {
  const zinnen = t.zinnen.map((z, i) =>
    '<div class="zin">' +
      '<div class="zinnl"><span class="em">' + z.em + '</span>' + L().zin[i] + '</div>' +
      '<div class="zinrechts">' +
        '<div class="zinwoorden">' +
          '<div class="zindoel">' + z.doel + '</div>' +
          (z.schrift ? '<div class="zinschrift">' + z.schrift + '</div>' : '') +
          (z.fon && z.fon[T] ? '<div class="zinfon">' + z.fon[T] + '</div>' : '') +
        '</div>' +
        '<button class="spreek" data-code="' + t.id + '" data-zin="' + esc(z.doel) + '" aria-label="' + esc(z.doel) + '" hidden>' + SPREKER + '</button>' +
      '</div>' +
    '</div>').join("");

  return '<li class="rij" id="' + t.id + '" style="--kleur:' + t.kleur + ';--motief:' + t.motief + ';--maat:' + t.maat + '">' +
    '<button class="rijknop" aria-expanded="false" aria-controls="u-' + t.id + '">' +
      '<span class="band"></span>' +
      '<span class="rijtekst">' +
        '<span class="naamblok">' +
          '<span class="taalnaam">' + t.naam[T] + '</span>' +
          '<span class="landen">' + t.landen.map(l =>
            '<span class="land"><span>' + l.vlag + '</span>' + l[T] + '</span>').join("") + '</span>' +
        '</span>' +
        '<span class="pijl">' + PIJL + '</span>' +
      '</span>' +
    '</button>' +
    '<div class="uit" id="u-' + t.id + '" hidden>' +
      zinnen +
      '<div class="voet">' +
        '<button class="speelKnop" data-code="' + t.id + '" aria-pressed="false" hidden>' +
          '<svg class="ik-speel" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>' +
          '<svg class="ik-stop" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>' +
          '<span>' + L().luister + '</span>' +
        '</button>' +
        '<button class="meerKnop" aria-expanded="false">' + L().meer + '</button>' +
        (gtLink(t) ? '<a class="gtLink" href="' + gtLink(t) + '" target="_blank" rel="noopener">Google Translate</a>' : '') +
      '</div>' +
      '<div class="notitie" hidden>' + t.notitie[T] + '</div>' +
    '</div>' +
  '</li>';
}

function lijstHtml() {
  return L().regio.map((kop, i) =>
    '<section class="regio">' +
      '<h2 class="regiokop">' + kop + '</h2>' +
      '<ul class="rijen">' + TALEN.filter(t => t.regio === i + 1).map(taalHtml).join("") + '</ul>' +
    '</section>').join("");
}

function bouw() {
  stopSessie();
  document.documentElement.lang = T;
  el("wordmerk").textContent = L().titel;
  el("inhoud").innerHTML = kiezersHtml() + lijstHtml();
  el("kiezerTaal").addEventListener("change", spring);
  el("kiezerLand").addEventListener("change", spring);
  toonSpreekknoppen();
}

/* ---------------- gedrag ---------------- */

function spring(e) {
  const id = e.target.value;
  if (!id) return;
  const doel = document.getElementById(id);
  /* Springen ruimt op: alle andere open kaarten dicht. Anders klopt de
     scrollpositie niet en is teruglopen eindeloos scrollen. Handmatig
     opentikken blijft wel stapelen, voor het vergelijken van buren. */
  document.querySelectorAll('.rijknop[aria-expanded="true"]').forEach(k => {
    if (k.closest(".rij").id !== id) klapOm(k);
  });
  const knop = doel.querySelector(".rijknop");
  if (knop && knop.getAttribute("aria-expanded") === "false") klapOm(knop);
  doel.scrollIntoView({ block: "start" });
  /* beide lijsten terug op de placeholder, zodat dezelfde keuze opnieuw kan */
  el("kiezerLand").selectedIndex = 0;
  el("kiezerTaal").selectedIndex = 0;
}

document.addEventListener("click", e => {
  const rijknop = e.target.closest(".rijknop");
  if (rijknop) return klapOm(rijknop);

  const meer = e.target.closest(".meerKnop");
  if (meer) {
    const n = meer.closest(".uit").querySelector(".notitie");
    n.hidden = !n.hidden;
    meer.setAttribute("aria-expanded", String(!n.hidden));
    return;
  }

  const speel = e.target.closest(".speelKnop");
  if (speel) {
    if (sessie && sessie.id === speel.dataset.code) stopSessie();
    else startSessie(speel.dataset.code);
    return;
  }

  const spreek = e.target.closest(".spreek");
  if (spreek) { stopSessie(); return zeg(spreek.dataset.zin, spreek.dataset.code); }
});

function klapOm(knop) {
  const paneel = document.getElementById(knop.getAttribute("aria-controls"));
  const open = paneel.hidden;
  if (!open && sessie && sessie.id === knop.closest(".rij").id) stopSessie();
  paneel.hidden = !open;
  knop.setAttribute("aria-expanded", String(open));
}

el("taalschakelaar").addEventListener("click", e => {
  const k = e.target.closest("button");
  if (!k || k.dataset.taal === T) return;
  T = k.dataset.taal;
  el("taalschakelaar").querySelectorAll("button").forEach(b =>
    b.setAttribute("aria-pressed", String(b.dataset.taal === T)));
  bouw();
});

/* ---------------- spraak ---------------- */

const STEM = {
  pools: "pl", koreaans: "ko", roemeens: "ro", kinyarwanda: "rw", albanees: "sq",
  fins: "fi", filipino: "fil", kroatisch: "hr", zoeloe: "zu",
  nederlands: "nl", noors: "nb", zweeds: "sv", deens: "da", engels: "en",
  afrikaans: "af", portugees: "pt", spaans: "es", frans: "fr", sranantongo: "srn"
};

let stemmen = [];
const vindStem = code =>
  stemmen.find(s => s.lang.toLowerCase().startsWith(code + "-")) ||
  stemmen.find(s => s.lang.toLowerCase() === code);

function zeg(tekst, id) {
  const stem = vindStem(STEM[id]);
  if (!stem) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(tekst);
  u.voice = stem; u.lang = stem.lang; u.rate = .85;
  speechSynthesis.speak(u);
}

function toonSpreekknoppen() {
  if (!("speechSynthesis" in window)) return;
  stemmen = speechSynthesis.getVoices();
  if (!stemmen.length) return;
  document.querySelectorAll(".spreek, .speelKnop").forEach(k => { k.hidden = !vindStem(STEM[k.dataset.code]); });
}

/* ---------------- luistersessie ----------------
   Eén kaart in een loop, voor passief leren: label in de interfacetaal, dan de
   doelzin twee keer met de native stem, alle regels langs en weer vooraan, tot
   stop. Stopt ook bij inklappen van de kaart, een losse spreekknop of
   taalwissel. iOS pauzeert spraak bij schermvergrendeling; scherm moet aan. */

let sessie = null;   /* { id, rij, stap, timer } */

function stopSessie() {
  if (!sessie) return;
  const kaart = document.getElementById(sessie.id);
  clearTimeout(sessie.timer);
  sessie = null;
  speechSynthesis.cancel();
  if (kaart) {
    kaart.querySelectorAll(".zin.actief").forEach(z => z.classList.remove("actief"));
    const knop = kaart.querySelector(".speelKnop");
    if (knop) {
      knop.setAttribute("aria-pressed", "false");
      knop.querySelector("span").textContent = L().luister;
    }
  }
}

function startSessie(id) {
  stopSessie();
  const t = TALEN.find(x => x.id === id);
  const stem = vindStem(STEM[id]);
  if (!t || !stem) return;
  const labelStem = vindStem(T);   /* interfacetaalstem; mag ontbreken */
  speechSynthesis.cancel();
  sessie = { id, rij: 0, stap: 0, timer: 0 };
  const knop = document.getElementById(id).querySelector(".speelKnop");
  knop.setAttribute("aria-pressed", "true");
  knop.querySelector("span").textContent = L().stop;
  sessieStap(t, stem, labelStem);
}

function sessieStap(t, stem, labelStem) {
  if (!sessie) return;
  const mijn = sessie;
  const zinnen = document.getElementById(mijn.id).querySelectorAll(".zin");
  zinnen.forEach((z, i) => z.classList.toggle("actief", i === mijn.rij));

  const label = mijn.stap === 0;
  if (label && !labelStem) { mijn.stap = 1; return sessieStap(t, stem, labelStem); }

  const u = new SpeechSynthesisUtterance(label ? L().zin[mijn.rij] : t.zinnen[mijn.rij].doel);
  const s = label ? labelStem : stem;
  u.voice = s; u.lang = s.lang; u.rate = label ? 1 : .85;

  let geweest = false;
  const verder = () => {
    if (geweest || sessie !== mijn) return;
    geweest = true;
    const pauze = label ? 350 : (mijn.stap === 1 ? 700 : 1100);
    mijn.timer = setTimeout(() => {
      if (sessie !== mijn) return;
      mijn.stap++;
      if (mijn.stap > 2) { mijn.stap = 0; mijn.rij = (mijn.rij + 1) % t.zinnen.length; }
      sessieStap(t, stem, labelStem);
    }, pauze);
  };
  u.onend = verder;
  u.onerror = verder;
  speechSynthesis.speak(u);
}

tekenBanner();
bouw();
if ("speechSynthesis" in window) speechSynthesis.onvoiceschanged = toonSpreekknoppen;

</script>
</body>
